name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Validate skill pack
        run: python engineering-workflows/scripts/validate_pack.py --root .

      - name: Run pack and helper tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s engineering-workflows/scripts -p 'test_*.py' -v

      - name: Run evaluation helper controls
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s evals -p 'test_*.py' -v
